<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Générateur de Miniatures</title>
</head>
<body style="background: #030712; margin: 0; padding: 20px;">
    <h1 style="color: white; font-family: Arial;">Cliquez droit > Enregistrer l'image sous</h1>
    
    <!-- Portfolio -->
    <h2 style="color: #F97316;">Portfolio</h2>
    <svg width="400" height="300" viewBox="0 0 400 300" style="border: 1px solid #333; display: block; margin: 10px 0;">
        <rect width="400" height="300" fill="#111827"/>
        <circle cx="100" cy="80" r="40" fill="#F97316" opacity="0.2"/>
        <circle cx="320" cy="200" r="60" fill="#F97316" opacity="0.15"/>
        <text x="200" y="150" font-size="48" fill="#F97316" font-weight="bold" text-anchor="middle" font-family="Arial">PORTFOLIO</text>
        <text x="200" y="200" font-size="20" fill="#999" text-anchor="middle" font-family="Arial">Showcase Personnel</text>
    </svg>

    <!-- TikTok Business -->
    <h2 style="color: #F97316;">TikTok Business</h2>
    <svg width="400" height="300" viewBox="0 0 400 300" style="border: 1px solid #333; display: block; margin: 10px 0;">
        <rect width="400" height="300" fill="#111827"/>
        <rect x="50" y="60" width="300" height="200" fill="none" stroke="#F97316" stroke-width="2"/>
        <text x="200" y="120" font-size="40" fill="#F97316" font-weight="bold" text-anchor="middle" font-family="Arial">TikTok</text>
        <text x="200" y="160" font-size="24" fill="#F97316" text-anchor="middle" font-family="Arial">Business</text>
        <text x="200" y="210" font-size="16" fill="#999" text-anchor="middle" font-family="Arial">Montage Professionnel</text>
    </svg>

    <!-- TikTok Rap Actu -->
    <h2 style="color: #F97316;">TikTok Rap Actu</h2>
    <svg width="400" height="300" viewBox="0 0 400 300" style="border: 1px solid #333; display: block; margin: 10px 0;">
        <rect width="400" height="300" fill="#111827"/>
        <circle cx="80" cy="100" r="30" fill="#F97316" opacity="0.3"/>
        <circle cx="320" cy="150" r="35" fill="#F97316" opacity="0.2"/>
        <polygon points="200,80 240,140 160,140" fill="#F97316" opacity="0.25"/>
        <text x="200" y="200" font-size="32" fill="#F97316" font-weight="bold" text-anchor="middle" font-family="Arial">RAP ACTU</text>
        <text x="200" y="240" font-size="14" fill="#999" text-anchor="middle" font-family="Arial">Édition Musicale</text>
    </svg>

    <!-- Sound Design -->
    <h2 style="color: #F97316;">Sound Design</h2>
    <svg width="400" height="300" viewBox="0 0 400 300" style="border: 1px solid #333; display: block; margin: 10px 0;">
        <rect width="400" height="300" fill="#111827"/>
        <path d="M 200 60 L 220 120 L 180 120 Z" fill="#F97316" opacity="0.3"/>
        <line x1="150" y1="150" x2="250" y2="150" stroke="#F97316" stroke-width="3" opacity="0.4"/>
        <line x1="130" y1="180" x2="270" y2="180" stroke="#F97316" stroke-width="2" opacity="0.3"/>
        <line x1="100" y1="210" x2="300" y2="210" stroke="#F97316" stroke-width="1" opacity="0.2"/>
        <text x="200" y="260" font-size="28" fill="#F97316" font-weight="bold" text-anchor="middle" font-family="Arial">SOUND DESIGN</text>
    </svg>

    <!-- Storytelling -->
    <h2 style="color: #F97316;">Vidéo Storytelling</h2>
    <svg width="400" height="300" viewBox="0 0 400 300" style="border: 1px solid #333; display: block; margin: 10px 0;">
        <rect width="400" height="300" fill="#111827"/>
        <circle cx="200" cy="100" r="50" fill="none" stroke="#F97316" stroke-width="2" opacity="0.4"/>
        <circle cx="200" cy="100" r="30" fill="none" stroke="#F97316" stroke-width="2"/>
        <polygon points="185,95 185,105 210,100" fill="#F97316"/>
        <text x="200" y="190" font-size="28" fill="#F97316" font-weight="bold" text-anchor="middle" font-family="Arial">STORYTELLING</text>
        <text x="200" y="230" font-size="14" fill="#999" text-anchor="middle" font-family="Arial">Récit Visuel</text>
    </svg>

    <!-- Homelander -->
    <h2 style="color: #F97316;">Projet Homelander</h2>
    <svg width="400" height="300" viewBox="0 0 400 300" style="border: 1px solid #333; display: block; margin: 10px 0;">
        <rect width="400" height="300" fill="#111827"/>
        <rect x="80" y="80" width="80" height="80" fill="#F97316" opacity="0.2" transform="rotate(15 120 120)"/>
        <rect x="240" y="80" width="80" height="80" fill="#F97316" opacity="0.15" transform="rotate(-15 280 120)"/>
        <line x1="120" y1="200" x2="280" y2="200" stroke="#F97316" stroke-width="3" opacity="0.5"/>
        <text x="200" y="260" font-size="26" fill="#F97316" font-weight="bold" text-anchor="middle" font-family="Arial">HOMELANDER</text>
    </svg>

    <!-- TikTok Edit -->
    <h2 style="color: #F97316;">TikTok Edit</h2>
    <svg width="400" height="300" viewBox="0 0 400 300" style="border: 1px solid #333; display: block; margin: 10px 0;">
        <rect width="400" height="300" fill="#111827"/>
        <rect x="60" y="70" width="60" height="60" fill="#F97316" opacity="0.3"/>
        <rect x="170" y="70" width="60" height="60" fill="#F97316" opacity="0.4"/>
        <rect x="280" y="70" width="60" height="60" fill="#F97316" opacity="0.25"/>
        <rect x="60" y="170" width="60" height="60" fill="#F97316" opacity="0.2"/>
        <rect x="170" y="170" width="60" height="60" fill="#F97316" opacity="0.35"/>
        <text x="200" y="270" font-size="24" fill="#F97316" font-weight="bold" text-anchor="middle" font-family="Arial">EDIT COLLECTION</text>
    </svg>

    <!-- TikTok Lego -->
    <h2 style="color: #F97316;">TikTok Lego</h2>
    <svg width="400" height="300" viewBox="0 0 400 300" style="border: 1px solid #333; display: block; margin: 10px 0;">
        <rect width="400" height="300" fill="#111827"/>
        <rect x="70" y="80" width="50" height="50" fill="#F97316" opacity="0.3"/>
        <rect x="130" y="80" width="50" height="50" fill="#F97316" opacity="0.4"/>
        <rect x="190" y="80" width="50" height="50" fill="#F97316" opacity="0.3"/>
        <rect x="250" y="80" width="50" height="50" fill="#F97316" opacity="0.35"/>
        <rect x="100" y="150" width="50" height="50" fill="#F97316" opacity="0.25"/>
        <rect x="160" y="150" width="50" height="50" fill="#F97316" opacity="0.4"/>
        <rect x="220" y="150" width="50" height="50" fill="#F97316" opacity="0.3"/>
        <text x="200" y="260" font-size="24" fill="#F97316" font-weight="bold" text-anchor="middle" font-family="Arial">LEGO STORY</text>
    </svg>

    <p style="color: #999; margin-top: 40px; font-family: Arial;">💡 Conseil: Exportez chaque SVG en PNG 400x300px via un convertisseur en ligne (cloudconvert.com) ou utilisez directement les URLs SVG</p>
</body>
</html>
